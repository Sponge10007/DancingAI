version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    environment:
      - DEBUG=true
      - GLM_API_KEY=${GLM_API_KEY}
    depends_on:
      - redis
    networks:
      - dance-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - dance-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dance-network

  # 可选：数据库服务
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: dance_analysis
  #     POSTGRES_USER: dance_user
  #     POSTGRES_PASSWORD: dance_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - dance-network

volumes:
  redis_data:
  # postgres_data:

networks:
  dance-network:
    driver: bridge
